<app-toolbar title="Account Viewer">
  <button mat-stroked-button (click)="openLoadDataDialog()">
    Load Account Data
  </button>
</app-toolbar>

<div class="table-container">
  @if (items().length > 0) {
  <app-line-item-table [lineItems]="items()"></app-line-item-table>
  } @else {
  <div class="placeholder">Click "Load Account Data" to get started.</div>
  }
</div>
